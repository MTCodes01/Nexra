version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexra-app
    restart: unless-stopped
    ports:
      - "1050:1050"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - PORT=1050
      - PUBLIC_URL=${PUBLIC_URL}
      - UPLOAD_PATH=/app/backend/storage/presentations
      - NODE_ENV=production
    volumes:
      - presentation_data:/app/backend/storage/presentations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexra_network

  postgres:
    image: postgres:15-alpine
    container_name: nexra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexra_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  nexra_network:
    driver: bridge

volumes:
  postgres_data:
  presentation_data:
